name: Apply SEO staging once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/week1-technical-pass
      - name: Decode staging tarball and commit
        run: |
          set -euo pipefail
          cat seo-staging/p00.b64 seo-staging/p01.b64 seo-staging/p02.b64 seo-staging/p03.b64 seo-staging/p04.b64 seo-staging/p05.b64 seo-staging/p06.b64 | base64 -d > /tmp/seo_remaining.tar.gz
          tar -xzf /tmp/seo_remaining.tar.gz
          rm -rf seo-staging
          rm -f .github/workflows/seo-apply-once.yml
          git config user.name "openpajobs-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Week 1 SEO/AEO technical pass (HTML + og-image from Claude bundle)"
          git push origin HEAD:seo/week1-technical-pass
