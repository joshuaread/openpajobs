name: Apply SEO staging once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/week1-technical-pass
      - name: Decode staging tarball and commit
        run: |
          set -euo pipefail
          tr -d '[:space:]' < <(cat seo-staging/q00.b64 seo-staging/q01.b64 seo-staging/q02.b64 seo-staging/q03.b64 seo-staging/q04.b64 seo-staging/q05.b64 seo-staging/q06.b64 seo-staging/q07.b64 seo-staging/q08.b64 seo-staging/q09.b64 seo-staging/q10.b64 seo-staging/q11.b64 seo-staging/q12.b64 seo-staging/q13.b64) | base64 -d > /tmp/seo_remaining.tar.gz
          tar -tzf /tmp/seo_remaining.tar.gz | head
          tar -xzf /tmp/seo_remaining.tar.gz
          rm -rf seo-staging
          rm -f .github/workflows/seo-apply-once.yml
          git config user.name "openpajobs-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -50
          git commit -m "Week 1 SEO/AEO technical pass (HTML + og-image from Claude bundle)"
          git push origin HEAD:seo/week1-technical-pass
